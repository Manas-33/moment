name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Django / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Dummy values so import-time checks pass without real credentials.
      # CI uses Django's default sqlite; no Redis/Postgres required.
      SECRET_KEY: ci-dummy-secret-key
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      DJANGO_SETTINGS_MODULE: shorts_generator.settings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django import sanity check
        run: python -c "import django; print('Django', django.get_version())"

      - name: Run pytest
        run: python -m pytest

  client:
    name: Client (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: |
          if npm run | grep -q "^  lint"; then
            npm run lint
          else
            echo "No lint script; skipping."
          fi

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-anon-key
        run: |
          if npm run | grep -q "^  build"; then
            npm run build
          else
            echo "No build script; skipping."
          fi
